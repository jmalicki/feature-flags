<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="862.4" viewBox="0 0 1000 862.4" role="img" aria-labelledby="timeline-title timeline-desc">
  <title id="timeline-title">From Google's remote builds to agents on development servers</title>
  <desc id="timeline-desc">A timeline of 15 dated events from 2008 to 2026 in the move of development from laptops to remote machines, at Google, Meta, Microsoft, Stripe, Slack, GitHub, Uber and Discord, from company publications, press reports and one former engineer's history.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="862.4" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">From remote builds to agents on development servers</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Dated events from company publications, press reports and one former engineer's history.</text>
    <line x1="236" y1="126" x2="236" y2="738.8" stroke="#d9d8d2" stroke-width="3" stroke-linecap="round"/>
<text x="214" y="131" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">2008</text>
<circle cx="236" cy="126" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="131" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Google builds with remote caching and remote execution</text>
<text x="214" y="171.8" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">about 2013</text>
<circle cx="236" cy="166.8" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="171.8" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Google's web editor, Cider, begins</text>
<text x="214" y="212.60000000000002" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">2016</text>
<circle cx="236" cy="207.60000000000002" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="212.60000000000002" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Most Google developers work through a cloud-backed checkout; its virtual desktops</text>
<text x="258" y="233.40000000000003" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">begin moving to Google Cloud</text>
<text x="214" y="274.20000000000005" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">2017</text>
<circle cx="236" cy="269.20000000000005" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="274.20000000000005" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Cloudtop is available to Google employees (press report)</text>
<text x="214" y="315.00000000000006" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">May 2019</text>
<circle cx="236" cy="310.00000000000006" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="315.00000000000006" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Microsoft announces remote development over ssh for VS Code</text>
<text x="214" y="355.80000000000007" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">Nov 2019</text>
<circle cx="236" cy="350.80000000000007" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="355.80000000000007" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Facebook makes VS Code its default editor, on reserved development servers</text>
<text x="214" y="396.6000000000001" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">2020</text>
<circle cx="236" cy="391.6000000000001" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="396.6000000000001" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Slack edits on the laptop and syncs to a server</text>
<text x="214" y="437.4000000000001" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">Aug 2021</text>
<circle cx="236" cy="432.4000000000001" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="437.4000000000001" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">GitHub moves development of github.com to Codespaces</text>
<text x="214" y="478.2000000000001" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">Oct 2021 to Jan 2022</text>
<circle cx="236" cy="473.2000000000001" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="478.2000000000001" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Slack's remote development: general availability, then over 90% of its engineers</text>
<text x="214" y="519.0000000000001" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">2022</text>
<circle cx="236" cy="514.0000000000001" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="519.0000000000001" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Stripe still syncs from the laptop; remote editing is in early beta</text>
<text x="214" y="559.8000000000001" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">2022</text>
<circle cx="236" cy="554.8000000000001" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="559.8000000000001" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Uber reports over 60% adoption; Meta describes on-demand development servers</text>
<text x="214" y="600.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">2023</text>
<circle cx="236" cy="595.6" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="600.6" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Google plans to make Cloudtop the default desktop (press report); a majority of</text>
<text x="258" y="621.4" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Meta developers use on-demand containers</text>
<text x="214" y="662.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">Feb 2024</text>
<circle cx="236" cy="657.2" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="662.2" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Discord completes the move of its backend development</text>
<text x="214" y="703" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">Aug 2024</text>
<circle cx="236" cy="698" r="7" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="703" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">A Stripe engineer writes that code is off laptops in many cases</text>
<text x="214" y="743.8" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="end">2026</text>
<circle cx="236" cy="738.8" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="258" y="743.8" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Stripe: most human-written code is produced over ssh on a devbox, and its coding</text>
<text x="258" y="764.5999999999999" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">agents run on devboxes</text>
<circle cx="40" cy="806.4" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="56" y="811.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Turning points</text>
<circle cx="196" cy="806.4" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="212" y="811.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Code synced from the laptop, a design Slack and Stripe later gave up</text>
    
  </g>
</svg>
