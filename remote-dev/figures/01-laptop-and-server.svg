<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="laptop-server-title laptop-server-desc">
  <title id="laptop-server-title">The laptop, the development server and its exits</title>
  <desc id="laptop-server-desc">The laptop holds an editor window, a browser and an ssh client, with no checkout and no long-lived credentials. It connects through single sign-on with a hardware key, a short-lived ssh certificate and one logged bastion to the development server, and the ssh session and the editor's connection run in both directions. The server holds the working checkout, the toolchain, running services and attended agents, and the engineer has root. The server has eight exits: a package proxy, a hosted search and fetch tool, a gateway, a service supplying fixtures and approved test datasets, the model endpoint, the editor's downloads, a code host that restricts pushes to approved repositories, and the build and deployment pipeline. Production is reached only by a reviewed change through the pipeline. The open internet is not reachable from the server. The engineer can inspect customer records in a separate interface under a temporary grant. Neither the workspace nor its agents can use that grant. Logs are kept off the server.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="850" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">The laptop, the development server and its exits</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">An engineer can administer the server. Separate services control what it can reach.</text>
    <rect x="32" y="112" width="250" height="214" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
