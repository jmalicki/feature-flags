<text x="678" y="786.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">The pipeline deploys reviewed changes</text>
<text x="678" y="804.3000000000001" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">with its own credentials</text>
    
