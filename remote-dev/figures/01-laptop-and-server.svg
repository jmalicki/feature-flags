<rect x="586" y="112" width="382" height="214" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="600" y="142" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Development server</text>
<text x="600" y="168.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Working checkout and toolchain</text>
<text x="600" y="191.29999999999998" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Builds, tests, running services</text>
<text x="600" y="214.49999999999997" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Attended agents</text>
<text x="600" y="237.69999999999996" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Engineer has root</text>
<text x="600" y="260.9" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Disk on a volume that outlives the machine</text>
<text x="600" y="284.09999999999997" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Outbound traffic denied by default, enforced</text>
<text x="600" y="302.29999999999995" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">outside the machine</text>
<text x="32" y="352" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">The ssh session and the editor's connection carry data in both directions.</text>
<text x="32" y="373" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Customer records stay in a separate interface that only an engineer with a temporary grant can open.</text>
<text x="32" y="404" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">THE SERVER'S EIGHT EXITS, EACH THROUGH A SERVICE THE ENGINEER DOES NOT ADMINISTER</text>
<rect x="32" y="418" width="225" height="118" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
