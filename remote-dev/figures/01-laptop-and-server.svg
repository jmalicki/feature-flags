<text x="46" y="474.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Fetches packages and</text>
<text x="46" y="492.3" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">public source itself</text>
<rect x="269" y="418" width="225" height="118" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="283" y="448" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Hosted search and</text>
<text x="283" y="470.1" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">fetch tool</text>
<text x="283" y="496.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Retrieves public pages and</text>
<text x="283" y="514.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">logs queries</text>
