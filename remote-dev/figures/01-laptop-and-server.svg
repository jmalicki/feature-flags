<text x="46" y="191.29999999999998" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Browser, open to the web</text>
<text x="46" y="214.49999999999997" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">ssh client</text>
<text x="46" y="237.69999999999996" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">No checkout</text>
<text x="46" y="260.9" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">No long-lived credentials</text>
<rect x="316" y="112" width="236" height="214" rx="8" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/>
