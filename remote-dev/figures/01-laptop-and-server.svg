<text x="330" y="168.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Single sign-on</text>
<text x="330" y="191.29999999999998" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Hardware key, touched</text>
<text x="330" y="214.49999999999997" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Short-lived ssh certificate</text>
<text x="330" y="237.69999999999996" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">One logged bastion</text>
