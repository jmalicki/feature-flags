<text x="520" y="492.3" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">wiki, tracker, chat and</text>
<text x="520" y="510.5" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">code search</text>
