<text x="46" y="578" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Model endpoint</text>
<text x="46" y="604.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Through a proxy that holds</text>
<text x="46" y="622.3000000000001" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">the key</text>
<rect x="269" y="548" width="225" height="118" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="283" y="578" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Editor downloads</text>
<text x="283" y="604.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Server component and</text>
<text x="283" y="622.3000000000001" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">approved extensions</text>
