<text x="757" y="474.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Supplies fixtures and</text>
<text x="757" y="492.3" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">approved test datasets</text>
