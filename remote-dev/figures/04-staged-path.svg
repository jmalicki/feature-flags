<text x="364" y="435.1" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">unstated)</text>
<rect x="350" y="464.00000000000006" width="300" height="68.4" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
