    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">A staged path to development servers</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Three phases; each step names a public account of an organization taking it.</text>
