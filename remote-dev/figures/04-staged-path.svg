<text x="46" y="803.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">A date for the end of local</text>
<text x="46" y="822.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">development on that application</text>
<text x="46" y="846.2" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Discord (backend work)</text>
<text x="350" y="116" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">PHASE TWO</text>
<text x="350" y="138" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">Needs more than one engineer</text>
<rect x="350" y="156" width="300" height="104.80000000000001" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="364" y="182" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Short-lived ssh certificates and</text>
<text x="364" y="201.5" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">one logged bastion</text>
<text x="364" y="225" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Meta (production, 2016); Netflix; US</text>
