<text x="46" y="669.9000000000001" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Slack, Discord, GitHub</text>
<rect x="32" y="698.8000000000001" width="300" height="68.4" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="46" y="724.8000000000001" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">A stop outside working hours</text>
