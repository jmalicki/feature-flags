<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="967.1" viewBox="0 0 1000 967.1" role="img" aria-labelledby="staged-path-title staged-path-desc">
  <title id="staged-path-title">A staged path to development servers, in three phases</title>
  <desc id="staged-path-desc">A staged path in three columns, one for each phase, with the public account behind each step. Phase one, which one engineer can run: one application that runs on one machine (Slack; Instacart, by its builder); a hosted product or plain virtual machines with a maintained image (Slack and Instacart built; Discord bought); ssh behind single sign-on with a hardware key (Google); outbound traffic denied, a package proxy, and no production credentials or real personal data (DZ BANK, co-written with its vendor; DekaBank, a vendor case study; Stripe); volunteers first, then the default for that application (Slack, Discord, GitHub); a stop outside working hours (Instacart, by its builder); a date for the end of local development on that application (Discord, for backend work). Phase two: short-lived ssh certificates and one logged bastion (Meta for production in 2016; Netflix; US guidance); a gateway for internal tools (Uber, Stripe, Cloudflare); attended agents on the engineer's own server (five engineers; Jane Street, location unstated); a hosted search and fetch tool (vendor documentation only). Phase three: a broker for data (GitLab; Envoy); unattended agents on their own servers with their own identities (Stripe's devboxes; LinkedIn's identities; Ramp's sandboxes); pools of pre-warmed machines (Slack, Stripe, GitHub, LinkedIn). Slack formed a team of two in early 2021, released a prototype in August 2021 and had over 90% of its engineers switched by the end of January 2022.</desc>
