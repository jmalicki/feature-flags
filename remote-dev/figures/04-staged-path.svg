<text x="46" y="299.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">machines, with a maintained image</text>
<text x="46" y="322.9" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Slack and Instacart built; Discord</text>
<text x="46" y="339.79999999999995" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">bought</text>
<rect x="32" y="368.70000000000005" width="300" height="87.9" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="46" y="394.70000000000005" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">ssh behind single sign-on with a</text>
<text x="46" y="414.20000000000005" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">hardware key</text>
<text x="46" y="437.70000000000005" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Google</text>
<rect x="32" y="466.6" width="300" height="124.30000000000001" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="46" y="492.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Outbound traffic denied; a package</text>
