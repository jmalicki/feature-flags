<text x="46" y="201.5" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">machine</text>
<text x="46" y="225" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Slack; Instacart (its builder)</text>
