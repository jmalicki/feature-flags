<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="feature-history-title feature-history-desc">
  <title id="feature-history-title">Two routes to history for a v2 feature</title>
  <desc id="feature-history-desc">Two routes to the history a v2 feature needs before a model can be trained on it. Backfill: history from an archive is recomputed in a batch backfill under the v2 logic with point-in-time joins, and an online-offline consistency check then measures the mismatch rate against values served online; this brings back a second code path. Logging: the feature is computed online and logged at serving time, and history accumulates; this is consistent by construction but costs calendar time, since a 90-day aggregate needs 90 days of history.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="540" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Two routes to history for a v2 feature</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">A model cannot be trained on a v2 feature until the feature has history.</text>
    <text x="32" y="128" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">BACKFILL</text>
<rect x="32" y="140" width="210" height="104" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Archive</text>
<text x="44" y="188.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">history the stream no</text>
<text x="44" y="207" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">longer holds</text>
<line x1="246" y1="192" x2="270" y2="192" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 262.8 188.5 L 270 192 L 262.8 195.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="274" y="140" width="210" height="104" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="286" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Batch backfill</text>
<text x="286" y="188.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">under the v2 logic, with</text>
<text x="286" y="207" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">point-in-time joins</text>
<line x1="488" y1="192" x2="512" y2="192" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 504.8 188.5 L 512 192 L 504.8 195.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="516" y="140" width="210" height="104" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="528" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Consistency check</text>
<text x="528" y="188.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">online and offline values</text>
<text x="528" y="207" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">compared; mismatch rate</text>
<text x="528" y="225.20000000000002" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">reported</text>
<line x1="730" y1="192" x2="754" y2="192" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 746.8 188.5 L 754 192 L 746.8 195.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="758" y="140" width="210" height="104" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="770" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Training data</text>
<text x="770" y="188.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">for models on v2</text>

<text x="32" y="272" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">A second code path. Offline and online values can disagree, so the gap is measured.</text>
<text x="32" y="332" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">LOGGING AT SERVING TIME</text>
<rect x="32" y="344" width="210" height="104" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44" y="370" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Online serving</text>
<text x="44" y="392.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">materialized online; no</text>
<text x="44" y="411" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">model reads it</text>
<line x1="246" y1="396" x2="270" y2="396" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 262.8 392.5 L 270 396 L 262.8 399.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="274" y="344" width="210" height="104" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="286" y="370" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Log features</text>
<text x="286" y="392.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">at serving time</text>
<line x1="488" y1="396" x2="512" y2="396" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 504.8 392.5 L 512 396 L 504.8 399.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="516" y="344" width="210" height="104" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="528" y="370" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">History accumulates</text>
<text x="528" y="392.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">a 90-day aggregate needs</text>
<text x="528" y="411" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">90 days</text>
<line x1="730" y1="396" x2="754" y2="396" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 746.8 392.5 L 754 396 L 746.8 399.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="758" y="344" width="210" height="104" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="770" y="370" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Training data</text>
<text x="770" y="392.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">for models on v2</text>

<text x="32" y="476" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">Consistent by construction. Costs calendar time before any model can be trained.</text>
    
  </g>
</svg>
