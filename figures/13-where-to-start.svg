<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="start-title start-desc">
  <title id="start-title">Six steps to begin</title>
  <desc id="start-desc">Six steps in order. One: measure where the three days go. Two: put today's process in a pipeline, manual steps included. Three: give one team the whole job including the pager. Four: ship the next risky change dark behind a flag at zero percent. Five: rehearse the way back and let whoever is paged roll back without asking. Six: automate a stage once it has become boring.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="510" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Where a fast follower starts</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Nothing here removes a control on day one.</text>
    <rect x="32" y="108" width="300" height="172" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="62" cy="140" r="16" fill="#2a78d6"/>
<text x="62" y="146" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="50" y="186" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Measure the three days</text>
<text x="50" y="212.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">How much is testing, and how much</text>
<text x="50" y="230.29999999999998" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">is waiting for a person?</text>
<rect x="350" y="108" width="300" height="172" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="380" cy="140" r="16" fill="#2a78d6"/>
<text x="380" y="146" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="368" y="186" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Put today's process in a</text>
<text x="368" y="208.1" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">pipeline</text>
<text x="368" y="234.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Manual steps and all. Change</text>
<text x="368" y="252.39999999999998" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">nothing yet.</text>
<rect x="668" y="108" width="300" height="172" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="698" cy="140" r="16" fill="#2a78d6"/>
<text x="698" y="146" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="686" y="186" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Give one team the whole job</text>
<text x="686" y="212.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Build it, deploy it, carry the</text>
<text x="686" y="230.29999999999998" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">pager for it.</text>
<rect x="32" y="298" width="300" height="172" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="62" cy="330" r="16" fill="#2a78d6"/>
<text x="62" y="336" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="50" y="376" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Ship the next risky change</text>
<text x="50" y="398.1" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">dark</text>
<text x="50" y="424.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Behind a flag at 0%, then shadow,</text>
<text x="50" y="442.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">staff, one client.</text>
<rect x="350" y="298" width="300" height="172" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="380" cy="330" r="16" fill="#2a78d6"/>
<text x="380" y="336" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="368" y="376" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Rehearse the way back</text>
<text x="368" y="402.1" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Roll back on purpose. Let whoever</text>
<text x="368" y="420.3" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">is paged do it without asking.</text>
<rect x="668" y="298" width="300" height="172" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="698" cy="330" r="16" fill="#2a78d6"/>
<text x="698" y="336" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="686" y="376" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Automate what has become</text>
<text x="686" y="398.1" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">boring</text>
<text x="686" y="424.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">One stage at a time, as the</text>
<text x="686" y="442.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">evidence builds.</text>
    
  </g>
</svg>
