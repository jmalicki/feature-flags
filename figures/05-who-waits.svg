<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="queue-title queue-desc">
  <title id="queue-title">A long canary makes every change wait; a flag ramp makes one behaviour wait</title>
  <desc id="queue-desc">Two schematic schedules over eleven days. In the first, each release holds the binary in a three-day soak; work finished meanwhile waits and is batched into the next release, so releases carry three changes each and go live on days three, six and nine. In the second, each change is deployed the day it is written after a short binary canary, and only one risky change ramps slowly behind a flag from dark to staff to one client, ten percent and one hundred percent without delaying the others.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="770" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Who waits for the slow change?</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">With a soak, every change waits and batches grow. With a flag, one risky behaviour waits alone.</text>
    <text x="32" y="128" font-size="14" fill="#52514e" font-weight="700" text-anchor="start">A LONG SOAK OR CANARY HOLDS THE WHOLE BINARY</text>
<text x="32" y="164" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Release 1</text>
<text x="32" y="183" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">3 changes</text>
