<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="sixteen-title sixteen-desc">
  <title id="sixteen-title">Amazon measured sixteen days from check-in to production, almost fourteen of them waiting</title>
  <desc id="sixteen-desc">A single bar sixteen days long. The remaining two days or so are building, deploying and testing. Almost fourteen days are waiting for a person to start the next step.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="320" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Measure the three days before defending them</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Amazon's own measurement before it automated its pipeline: 16 days from check-in to production.</text>
    <path d="M 32 176 H 141 Q 145 176 145 180 V 196 Q 145 200 141 200 H 32 Z" fill="#2a78d6"/>
<path d="M 148 176 H 956 Q 960 176 960 180 V 196 Q 960 200 956 200 H 148 Z" fill="#eb6834"/>
