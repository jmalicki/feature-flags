<line x1="322" y1="206" x2="322" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="380" y1="206" x2="380" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="438" y1="206" x2="438" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="496" y1="206" x2="496" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="554" y1="206" x2="554" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="612" y1="206" x2="612" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="670" y1="206" x2="670" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="728" y1="206" x2="728" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="786" y1="206" x2="786" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="844" y1="206" x2="844" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="902" y1="206" x2="902" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="960" y1="206" x2="960" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<text x="32" y="140" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">The other two days or so</text>
<text x="32" y="162" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">building, deploying, testing</text>
<text x="148" y="238" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Almost 14 days of waiting</text>
<text x="148" y="260" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">for someone to start the build, run the deployment, or run the tests</text>
    <text x="32" y="298" font-size="14" fill="#8a8983" font-weight="400" text-anchor="start">Reported in 2019 as a measurement taken more than ten years earlier.</text>
  </g>
</svg>
