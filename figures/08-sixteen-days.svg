<line x1="148" y1="206" x2="148" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<line x1="206" y1="206" x2="206" y2="212" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
