<text x="178" y="172" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Submission</text>
<text x="178" y="194.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">reads the flag</text>
<rect x="300" y="146" width="128" height="100" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="312" y="172" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Confirmation</text>
<text x="312" y="194.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">reads the flag</text>
<rect x="434" y="146" width="128" height="100" rx="8" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/>
<text x="446" y="172" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Returns</text>
<text x="446" y="194.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">now gets the</text>
<text x="446" y="213" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">other behavior</text>
<rect x="568" y="146" width="128" height="100" rx="8" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/>
<text x="580" y="172" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Recalls</text>
<text x="580" y="194.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">now gets the</text>
<text x="580" y="213" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">other behavior</text>
<rect x="702" y="146" width="128" height="100" rx="8" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/>
<text x="714" y="172" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Status</text>
<text x="714" y="192.8" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">inquiries</text>
<text x="714" y="215.6" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">now gets the</text>
<text x="714" y="233.79999999999998" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">other behavior</text>
<rect x="836" y="146" width="128" height="100" rx="8" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/>
<text x="848" y="172" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Postings</text>
<text x="848" y="194.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">now gets the</text>
<text x="848" y="213" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">other behavior</text>
<text x="32" y="282" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">The payment is stranded between two behaviors.</text>
<text x="32" y="330" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">THE DECISION IS MADE ONCE, AT ACCEPTANCE, AND STORED</text>
