<text x="32" y="566" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">Switching the flag changes which rail later payments get. This payment follows its stored rail for the rest of its</text>
<text x="32" y="585.5" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">life.</text>
    
