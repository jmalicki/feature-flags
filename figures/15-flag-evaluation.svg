<text x="44" y="408.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">reads the</text>
<text x="44" y="427" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">flag, stores</text>
<text x="44" y="445.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">the rail</text>
<rect x="166" y="360" width="128" height="100" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="178" y="386" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Submission</text>
<text x="178" y="408.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">follows the</text>
<text x="178" y="427" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">stored rail</text>
<rect x="300" y="360" width="128" height="100" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="312" y="386" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Confirmation</text>
<text x="312" y="408.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">follows the</text>
<text x="312" y="427" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">stored rail</text>
<rect x="434" y="360" width="128" height="100" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="446" y="386" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Returns</text>
<text x="446" y="408.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">follows the</text>
<text x="446" y="427" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">stored rail</text>
<rect x="568" y="360" width="128" height="100" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="580" y="386" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Recalls</text>
<text x="580" y="408.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">follows the</text>
<text x="580" y="427" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">stored rail</text>
<rect x="702" y="360" width="128" height="100" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="714" y="386" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Status</text>
<text x="714" y="406.8" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">inquiries</text>
<text x="714" y="429.6" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">follows the</text>
<text x="714" y="447.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">stored rail</text>
<rect x="836" y="360" width="128" height="100" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="848" y="386" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Postings</text>
<text x="848" y="408.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">follows the</text>
<text x="848" y="427" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">stored rail</text>
<rect x="32" y="496" width="936" height="34" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="48" y="518" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">Payment record: payment.rail, written at acceptance</text>
