<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="flag-eval-title flag-eval-desc">
  <title id="flag-eval-title">Reading the flag once at acceptance</title>
  <desc id="flag-eval-desc">A payment's life runs through acceptance, submission, confirmation, returns, recalls, status inquiries and postings. In the first row each step reads the flag again, so when the flag is switched after confirmation the later steps follow the other behavior and the payment is stranded between two behaviors. In the second row the flag is read once, at acceptance, and the decision is stored with the payment as payment.rail; every later step follows the stored decision, so switching the flag does not change this payment.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="640" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Reading the flag once at acceptance</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">One payment's life, with the flag switched partway through.</text>
    <text x="32" y="116" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">THE FLAG IS READ AT EVERY STEP</text>
<line x1="431" y1="124" x2="431" y2="258" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="437" y="136" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start">flag switched</text>
<rect x="32" y="146" width="128" height="100" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="44" y="172" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Acceptance</text>
<text x="44" y="194.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">reads the flag</text>
