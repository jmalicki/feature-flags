<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="mechanism-title mechanism-desc">
  <title id="mechanism-title">One mechanism, three settings</title>
  <desc id="mechanism-desc">A loop of three steps: expose a subset, compare with the rest, then expand or revert. Below it, three settings of the same loop. A canary varies the binary across machines and asks whether it is broken. A flag ramp varies one behaviour across accounts, merchants or users and asks whether it is broken. An experiment varies one behaviour across randomised accounts or users and asks whether it is better.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="540" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">One mechanism, three settings</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Canaries, flag ramps and experiments run the same loop with different settings.</text>
    <rect x="70" y="118" width="256" height="84" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="82" y="144" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Expose a subset</text>
<text x="82" y="166.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">machines, accounts or users</text>
<line x1="329" y1="160" x2="368" y2="160" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 360.8 156.5 L 368 160 L 360.8 163.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="372" y="118" width="256" height="84" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="384" y="144" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Compare with the rest</text>
<text x="384" y="166.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">errors, latency, money,</text>
<text x="384" y="185" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">behaviour</text>
<line x1="631" y1="160" x2="670" y2="160" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 662.8 156.5 L 670 160 L 662.8 163.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="674" y="118" width="256" height="84" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="686" y="144" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Expand, or revert</text>
<text x="686" y="166.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">automatically where possible</text>

<path d="M 802 202 V 232 H 198 V 208" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="198" y1="214" x2="198" y2="205" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 194.5 212.2 L 198 205 L 201.5 212.2" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="296" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">Canary</text>
<text x="468" y="296" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">Flag ramp</text>
<text x="736" y="296" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">Experiment</text>
<line x1="32" y1="314" x2="968" y2="314" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<text x="32" y="350" font-size="12" fill="#8a8983" font-weight="700" text-anchor="start">WHAT VARIES</text>
<text x="200" y="344" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">The binary</text>
<text x="468" y="344" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">One behaviour inside the binary</text>
<text x="736" y="344" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">One behaviour inside the binary</text>
<line x1="32" y1="376" x2="968" y2="376" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<text x="32" y="412" font-size="12" fill="#8a8983" font-weight="700" text-anchor="start">WHO IS EXPOSED</text>
<text x="200" y="406" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">Machines</text>
<text x="468" y="406" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">Accounts, merchants, users</text>
<text x="736" y="406" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">Randomised accounts or users</text>
<line x1="32" y1="438" x2="968" y2="438" stroke="#d9d8d2" stroke-width="1.5" stroke-linecap="round"/>
<text x="32" y="474" font-size="12" fill="#8a8983" font-weight="700" text-anchor="start">THE QUESTION</text>
<text x="200" y="468" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">Is it broken?</text>
<text x="468" y="468" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">Is it broken?</text>
<text x="736" y="468" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">Is it better?</text>
    
  </g>
</svg>
