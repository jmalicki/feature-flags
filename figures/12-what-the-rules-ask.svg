<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="628" viewBox="0 0 1000 628" role="img" aria-labelledby="controls-title controls-desc">
  <title id="controls-title">What the rules ask for, and what a pipeline produces</title>
  <desc id="controls-desc">Six requirements common to the rule texts, each matched to pipeline evidence: a record of every change is the commit and pipeline run; proportionate testing is the attached test results; approval by someone other than the author is enforced peer review; separation of production is the absence of standing human access; a way back is the retained image and a rehearsed rollback; an audit trail is an unalterable log. No text read asks for a soak period, a release train or multi-day promotion.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="628" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">What the rules ask for</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Common to PCI DSS v4.0, the US FFIEC handbook, the EBA guidelines, EU DORA and Singapore's MAS.</text>
    <text x="32" y="132" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">THE RULE TEXTS ASK FOR</text>
<text x="490" y="132" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">A PIPELINE PRODUCES, ON EVERY CHANGE</text>
<rect x="32" y="150" width="400" height="46" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="48" y="178" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">A record of every change</text>
<line x1="438" y1="173" x2="484" y2="173" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 476.8 169.5 L 484 173 L 476.8 176.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="150" width="478" height="46" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="506" y="178" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">The commit and the pipeline run, written automatically</text>
<rect x="32" y="208" width="400" height="46" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="48" y="236" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Testing in proportion to the risk</text>
<line x1="438" y1="231" x2="484" y2="231" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 476.8 227.5 L 484 231 L 476.8 234.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="208" width="478" height="46" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="506" y="236" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">Test results attached to that run</text>
<rect x="32" y="266" width="400" height="46" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="48" y="294" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Approval by someone other than the author</text>
<line x1="438" y1="289" x2="484" y2="289" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 476.8 285.5 L 484 289 L 476.8 292.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="266" width="478" height="46" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="506" y="286" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">Peer review the pipeline enforces; extra approvers where the</text>
<text x="506" y="304.2" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">rule asks</text>
<rect x="32" y="324" width="400" height="46" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="48" y="352" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Production kept separate from development</text>
<line x1="438" y1="347" x2="484" y2="347" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 476.8 343.5 L 484 347 L 476.8 350.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="324" width="478" height="46" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="506" y="344" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">No standing human access to production; the pipeline is the</text>
<text x="506" y="362.2" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">only way in</text>
<rect x="32" y="382" width="400" height="46" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="48" y="410" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">A way back</text>
<line x1="438" y1="405" x2="484" y2="405" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 476.8 401.5 L 484 405 L 476.8 408.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="382" width="478" height="46" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="506" y="402" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">The previous image, kept by hash, and a rollback that is</text>
<text x="506" y="420.2" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">rehearsed</text>
<rect x="32" y="440" width="400" height="46" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="48" y="468" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">An audit trail</text>
<line x1="438" y1="463" x2="484" y2="463" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 476.8 459.5 L 484 463 L 476.8 466.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="440" width="478" height="46" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="506" y="460" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">An unalterable log tying commit, review, tests and</text>
<text x="506" y="478.2" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">deployment together</text>
<rect x="32" y="510" width="936" height="62" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="50" y="536" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Not asked for in any text read</text>
<text x="50" y="558" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">A soak period. A release train. Promotion through environments over several days.</text>
    <text x="32" y="606" font-size="14" fill="#8a8983" font-weight="400" text-anchor="start">Approval stays. At every regulated firm that has published its design, named people still approve.</text>
  </g>
</svg>
