<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="three-arm-title three-arm-desc">
  <title id="three-arm-title">Booking.com's three-arm model comparison</title>
  <desc id="three-arm-desc">Booking.com's design for comparing two models. The control arm computes only model 1, the current baseline, and acts on it; it is also the safety net. Treatment 1 and treatment 2 both compute model 1 and model 2, so they carry the same computational load and latency drops out as a confounder; treatment 1 acts on model 1 and treatment 2 acts on model 2. The analysis covers only the requests on which the two models disagree. Computing both models doubles inference and feature-fetching cost in the treatment arms.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="580" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Booking.com's three-arm model comparison</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Both treatment arms compute both models, so load and latency are the same in each.</text>
    <rect x="32" y="140" width="210" height="76" rx="8" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/>
<text x="44" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Control</text>
<text x="44" y="188.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">model 1 only; baseline</text>
<text x="44" y="207" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">and safety net</text>
<line x1="246" y1="178" x2="272" y2="178" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 264.8 174.5 L 272 178 L 264.8 181.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="276" y="140" width="150" height="76" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="288" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Model 1</text>
<text x="288" y="188.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">computed</text>

<line x1="430" y1="178" x2="646" y2="178" stroke="#52514e" stroke-width="2" stroke-linecap="round"/><path d="M 638.8 174.5 L 646 178 L 638.8 181.5" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="650" y="140" width="180" height="76" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="662" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Acts on model 1</text>

<rect x="32" y="240" width="210" height="76" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44" y="266" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Treatment 1</text>
<text x="44" y="288.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">both models computed</text>
<line x1="246" y1="278" x2="272" y2="278" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 264.8 274.5 L 272 278 L 264.8 281.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="276" y="240" width="150" height="76" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
