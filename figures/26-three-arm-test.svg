<rect x="440" y="240" width="150" height="76" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="452" y="266" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Model 2</text>
<text x="452" y="288.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">computed</text>
<line x1="594" y1="278" x2="646" y2="278" stroke="#52514e" stroke-width="2" stroke-linecap="round"/><path d="M 638.8 274.5 L 646 278 L 638.8 281.5" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="650" y="240" width="180" height="76" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="662" y="266" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Acts on model 1</text>

