<text x="452" y="366" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Model 2</text>
<text x="452" y="388.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">computed</text>
<line x1="594" y1="378" x2="646" y2="378" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 638.8 374.5 L 646 378 L 638.8 381.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="650" y="340" width="180" height="76" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
