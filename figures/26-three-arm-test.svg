<path d="M 848 240 H 860 V 416 H 848" fill="none" stroke="#2a78d6" stroke-width="2"/>
<text x="872" y="264" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start">Same</text>
<text x="872" y="280.9" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start">computational</text>
<text x="872" y="297.8" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start">load in both</text>
<text x="872" y="314.7" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start">arms</text>
