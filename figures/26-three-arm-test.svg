<text x="52" y="474" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Analysis</text>
<text x="52" y="498" font-size="15" fill="#0b0b0b" font-weight="400" text-anchor="start">Only the requests on which model 1 and model 2 disagree.</text>
    <text x="32" y="558" font-size="14" fill="#8a8983" font-weight="400" text-anchor="start">Computing both models doubles inference and feature-fetching cost in the treatment arms.</text>
