<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1055" viewBox="0 0 1000 1055" role="img" aria-labelledby="timeline-title timeline-desc">
  <title id="timeline-title">Twenty-five years of published practice</title>
  <desc id="timeline-desc">A timeline from 2000 to 2025 in four bands: foundations in continuous integration and experimentation; the vocabulary of dark launches, flags and frequent deployment appearing from 2008 to 2011; scale reports, failures and the first studies from 2012 to 2016; and banks and regulators from 2017 to 2025.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="1055" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Published accounts, 2000 to 2025</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Dates are when a practice was documented, not when it was invented.</text>
    <line x1="150" y1="140" x2="150" y2="991" stroke="#d9d8d2" stroke-width="2" stroke-linecap="round"/>
<text x="172" y="122" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">FOUNDATIONS</text>
<text x="128" y="149" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2000</text>
<circle cx="150" cy="144" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="149" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Fowler and Foemmel describe continuous integration: merge and test daily.</text>
<text x="128" y="183" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2007</text>
<circle cx="150" cy="178" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="183" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Kohavi and colleagues: start experiments small, ramp up, abort automatically. Google's search</text>
<text x="172" y="204" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">experiment system first deployed.</text>
<text x="172" y="247" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">THE VOCABULARY APPEARS</text>
<text x="128" y="274" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2008</text>
<circle cx="150" cy="269" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="274" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Facebook Chat runs dark on live traffic from February; users see it in April.</text>
<text x="128" y="308" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2009</text>
<circle cx="150" cy="303" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="308" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">IMVU describes fifty deploys a day. Flickr describes flags and ten-plus deploys a day.</text>
<text x="128" y="342" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2010</text>
<circle cx="150" cy="337" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="342" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Wealthfront, an SEC-regulated firm: one instance first, automatic rollback in seconds.</text>
<text x="128" y="376" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2011</text>
<circle cx="150" cy="371" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="376" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Etsy says its flags were taken almost exactly from Flickr.</text>
<text x="172" y="419" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">SCALE, FAILURES AND THE FIRST STUDIES</text>
<text x="128" y="446" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2012</text>
<circle cx="150" cy="441" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="446" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Knight Capital: a reused flag and one stale server lose $460 million in 45 minutes.</text>
<text x="128" y="480" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2013</text>
<circle cx="150" cy="475" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="480" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Netflix scores canaries automatically. Visual Studio Online goes down on a launch morning</text>
<text x="172" y="501" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">because of flags.</text>
<text x="128" y="535" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2014</text>
<circle cx="150" cy="530" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="535" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Visual Studio Online builds a first ring of volunteer accounts that takes every deployment</text>
<text x="172" y="556" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">first.</text>
<text x="128" y="590" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2015</text>
<circle cx="150" cy="585" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="590" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Facebook paper: ship code disabled, ramp it with Gatekeeper, canary the configuration too.</text>
<text x="128" y="624" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2016</text>
<circle cx="150" cy="619" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="624" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Facebook and OANDA study continuous deployment, including at an FX trading platform.</text>
<text x="172" y="667" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">BANKS AND REGULATORS</text>
<text x="128" y="694" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2017</text>
<circle cx="150" cy="689" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="694" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Facebook's website moves to deploying continuously from the main branch.</text>
<text x="128" y="728" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2018</text>
<circle cx="150" cy="723" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="728" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Starling Bank releases to production up to five times a day. France's ACPR describes batched</text>
<text x="172" y="749" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">releases outside service hours.</text>
<text x="128" y="783" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2020</text>
<circle cx="150" cy="778" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="783" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Amazon documents its pipeline: one box, then waves, with bake times and automatic rollback.</text>
<text x="128" y="817" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2021</text>
<circle cx="150" cy="812" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="817" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">The ACPR accepts automated change processes. The UK FCA's review of 23 firms: smaller, more</text>
<text x="172" y="838" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">frequent releases succeed more often.</text>
<text x="128" y="872" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2022</text>
<circle cx="150" cy="867" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="872" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">Monzo, a bank, deploys more than 100 times a day and rolls automated rollback out across</text>
<text x="172" y="893" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">2,100 services.</text>
<text x="128" y="927" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2024</text>
<circle cx="150" cy="922" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="927" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">The US bank examiners' handbook mentions canary releases.</text>
<text x="128" y="961" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="end">2025</text>
<circle cx="150" cy="956" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="172" y="961" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">DORA's change rules apply in the EU; its standards permit testing in production as an</text>
<text x="172" y="982" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">approved exception.</text>
    
  </g>
</svg>
