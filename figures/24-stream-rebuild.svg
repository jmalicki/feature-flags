<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="kreps-title kreps-desc">
  <title id="kreps-title">Rebuilding a stream job's output</title>
  <desc id="kreps-desc">Jay Kreps's 2014 procedure for changing the logic of a stream job. The log holds the retained data. Job v1, with the current logic, writes table v1. A second instance, job v2, runs the new logic from the beginning of the retained data and writes table v2. The application reads table v1 until job v2 has caught up, then switches to reading table v2. While both tables exist, pointing the application back at table v1 reverts the change. The old job is then stopped and the old table deleted.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="500" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Rebuilding a stream job's output</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">In Jay Kreps's 2014 procedure, a second job rebuilds the output from the log into a new table.</text>
    <rect x="32" y="130" width="160" height="286" rx="8" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/>
<text x="44" y="156" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Log</text>
<text x="44" y="178.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">retained data; a</text>
<text x="44" y="197" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">job can rebuild</text>
<text x="44" y="215.20000000000002" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">only from what the</text>
<text x="44" y="233.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">log still holds</text>
<line x1="196" y1="180" x2="246" y2="180" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 238.8 176.5 L 246 180 L 238.8 183.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="250" y="140" width="190" height="80" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="262" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Job v1</text>
<text x="262" y="188.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">current logic</text>
<line x1="444" y1="180" x2="490" y2="180" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 482.8 176.5 L 490 180 L 482.8 183.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="494" y="140" width="170" height="80" rx="8" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/>
<text x="506" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Table v1</text>

<line x1="196" y1="360" x2="246" y2="360" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 238.8 356.5 L 246 360 L 238.8 363.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="250" y="320" width="190" height="96" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="262" y="346" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Job v2</text>
<text x="262" y="368.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">new logic, run from</text>
<text x="262" y="387" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">the beginning of the</text>
<text x="262" y="405.2" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">retained data</text>
<line x1="444" y1="360" x2="490" y2="360" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 482.8 356.5 L 490 360 L 482.8 363.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="494" y="320" width="170" height="80" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="506" y="346" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Table v2</text>

<rect x="798" y="230" width="170" height="80" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="810" y="256" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Application</text>
<text x="810" y="278.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">reads one table at</text>
<text x="810" y="297" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">a time</text>
<line x1="668" y1="186" x2="794" y2="250" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M 789.2 243.6 L 794 250 L 786.0 249.8" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="690" y="172" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">read until the switch;</text>
<text x="690" y="188" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">pointing back here reverts the change</text>
<line x1="668" y1="354" x2="794" y2="292" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/><path d="M 786.0 292.1 L 794 292 L 789.1 298.3" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="690" y="370" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">read once job v2</text>
<text x="690" y="386" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">has caught up</text>
    <text x="32" y="478" font-size="14" fill="#8a8983" font-weight="400" text-anchor="start">After the switch, the old job is stopped and the old table deleted.</text>
  </g>
</svg>
