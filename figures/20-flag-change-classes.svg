<rect x="816" y="150" width="152" height="118" rx="8" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/>
<text x="828" y="176" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Step outside</text>
<text x="828" y="196.8" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">the plan</text>
<text x="828" y="219.6" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">normal change</text>
<path d="M 432 138 V 130 H 804 V 138" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="618" y="122" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">within the approved plan</text>
<rect x="232" y="310" width="736" height="80" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="250" y="340" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Switching the flag off, or rolling back to the previous build</text>
<text x="250" y="366" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Pre-authorized at any point. The on-call engineer acts without asking, and the action is reviewed afterwards.</text>
<rect x="32" y="414" width="936" height="64" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="50" y="442" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Evidence</text>
<text x="50" y="464" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">The state of every flag on any given date can be produced.</text>
    <text x="32" y="538" font-size="14" fill="#8a8983" font-weight="400" text-anchor="start">Raising every step as a normal change with three days' notice makes the ramp slower than the train.</text>
