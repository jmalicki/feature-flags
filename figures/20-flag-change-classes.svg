<text x="44" y="217.6" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">flag</text>
<text x="44" y="240.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">normal review and</text>
<text x="44" y="258.6" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">deployment</text>
<line x1="216" y1="209" x2="228" y2="209" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 220.8 205.5 L 228 209 L 220.8 212.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="232" y="150" width="180" height="118" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="244" y="176" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Ramp plan</text>
<text x="244" y="198.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">stages, holds,</text>
<text x="244" y="217" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">population, caps and</text>
<text x="244" y="235.20000000000002" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">stop conditions:</text>
<text x="244" y="253.4" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">approved once</text>
