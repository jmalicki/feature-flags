    <rect x="0" y="0" width="1000" height="560" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Change classes for a flag</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Each kind of flag change, and the change class it is handled under.</text>
    <rect x="32" y="150" width="180" height="118" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
