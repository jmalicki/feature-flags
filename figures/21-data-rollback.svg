    <rect x="0" y="0" width="1000" height="470" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">What a table rollback restores</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Restoring the source table leaves everything built from the bad version unchanged.</text>
    <text x="186" y="172" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">TEN DERIVED TABLES</text>
