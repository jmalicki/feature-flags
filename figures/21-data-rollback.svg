<rect x="654" y="190" width="44" height="80" rx="8" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/><text x="676" y="236" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">10</text>
