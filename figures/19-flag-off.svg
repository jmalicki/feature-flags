<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="flag-off-title flag-off-desc">
  <title id="flag-off-title">Switching the instant-rail flag off</title>
  <desc id="flag-off-desc">Two rails over time, with the flag switched off partway. Payments already sent on rail B before the switch are final and none is recalled. After the switch, new payments go to rail A from its next submission window. The exposure is bounded by the caps: the daily cap, multiplied by the number of clients enabled, multiplied by the number of days a fault goes unnoticed. A switch after A's last cut-off of the day leaves those payments waiting until the next business day.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="600" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Switching the instant-rail flag off</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">What changes for payments sent before the switch and for new payments after it.</text>
    <line x1="520" y1="118" x2="520" y2="390" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="520" y="112" font-size="14" fill="#eb6834" font-weight="700" text-anchor="middle">flag switched off</text>
<text x="32" y="186" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Rail B</text>
<text x="32" y="208" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">instant, final within seconds</text>
<line x1="210" y1="180" x2="968" y2="180" stroke="#d9d8d2" stroke-width="2" stroke-linecap="round"/>
<circle cx="236" cy="180" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="276" cy="180" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="316" cy="180" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="356" cy="180" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="396" cy="180" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="436" cy="180" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="476" cy="180" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="230" y="216" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">Sent on B before the switch: final, and</text>
<text x="230" y="234.2" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">none is recalled</text>
<text x="544" y="186" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">no new payments on B</text>
<text x="32" y="326" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">Rail A</text>
<text x="32" y="348" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">batch clearing</text>
<line x1="210" y1="320" x2="968" y2="320" stroke="#d9d8d2" stroke-width="2" stroke-linecap="round"/>
<rect x="365" y="302" width="10" height="36" rx="2" fill="#52514e" stroke="none" stroke-width="1.5"/>
<rect x="655" y="302" width="10" height="36" rx="2" fill="#52514e" stroke="none" stroke-width="1.5"/>
<rect x="895" y="302" width="10" height="36" rx="2" fill="#52514e" stroke="none" stroke-width="1.5"/>
<text x="370" y="294" font-size="12" fill="#8a8983" font-weight="400" text-anchor="middle">submission window</text>
<text x="660" y="294" font-size="12" fill="#8a8983" font-weight="400" text-anchor="middle">next submission window</text>
<circle cx="548" cy="320" r="7" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/>
<circle cx="580" cy="320" r="7" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/>
<circle cx="612" cy="320" r="7" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/>
<line x1="624" y1="320" x2="650" y2="320" stroke="#52514e" stroke-width="2" stroke-linecap="round"/><path d="M 642.8 316.5 L 650 320 L 642.8 323.5" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="544" y="360" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">New payments go to A from its next submission window.</text>
<text x="544" y="378.2" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">After A's last cut-off of the day, they wait until the</text>
<text x="544" y="396.4" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">next business day.</text>
<rect x="32" y="448" width="936" height="100" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="52" y="478" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Exposure while a fault goes unnoticed is bounded by the caps</text>
<text x="52" y="516" font-size="17" fill="#0b0b0b" font-weight="400" text-anchor="start">daily cap  ×  number of clients enabled  ×  days the fault goes unnoticed</text>
    
  </g>
</svg>
