<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="wait-title wait-desc">
  <title id="wait-title">Where the wait happens</title>
  <desc id="wait-desc">Two pipelines. In the testing-period model, several days of changes are built together, promoted through DEV, UAT and pre-production where they soak, then released to every client at once. In the production-ramp model, one small change is built, tested and peer reviewed, deployed dark with nobody exposed, then exposed to staff, one client, ten percent and everyone, with the wait spent in production at limited exposure.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="580" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">The wait did not disappear. It moved.</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Both models wait. They differ in where the time is spent and who is exposed meanwhile.</text>
    <text x="32" y="134" font-size="14" fill="#52514e" font-weight="700" text-anchor="start">TESTING PERIOD: PROVE IT SAFE, THEN RELEASE IT</text>
<rect x="32" y="150" width="150" height="92" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="44" y="176" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Build</text>
<text x="44" y="198.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">several days of</text>
<text x="44" y="217" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">changes</text>
<line x1="185" y1="196" x2="196" y2="196" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 188.8 192.5 L 196 196 L 188.8 199.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="200" y="150" width="112" height="92" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="212" y="176" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">DEV</text>

<line x1="315" y1="196" x2="326" y2="196" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 318.8 192.5 L 326 196 L 318.8 199.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="330" y="150" width="112" height="92" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="342" y="176" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">UAT</text>

<line x1="445" y1="196" x2="456" y2="196" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 448.8 192.5 L 456 196 L 448.8 199.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="460" y="150" width="242" height="92" rx="8" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/>
<text x="472" y="176" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Pre-production</text>
<text x="472" y="198.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">soak: the wait happens here</text>
<line x1="705" y1="196" x2="716" y2="196" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 708.8 192.5 L 716 196 L 708.8 199.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="720" y="150" width="248" height="92" rx="8" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/>
<text x="732" y="176" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Production</text>
<text x="732" y="198.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">every client at once</text>

<line x1="460" y1="262" x2="702" y2="262" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/>
<text x="460" y="286" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">Days of waiting, on synthetic traffic</text>
<line x1="720" y1="262" x2="968" y2="262" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/>
<text x="720" y="286" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">Exposure jumps from 0% to 100%</text>
<text x="32" y="364" font-size="14" fill="#52514e" font-weight="700" text-anchor="start">PRODUCTION RAMP: RELEASE IT A LITTLE, AND PROVE IT AS YOU GO</text>
<rect x="32" y="380" width="212" height="92" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="44" y="406" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Build + tests + peer</text>
<text x="44" y="426.8" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">review</text>
<text x="44" y="449.6" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">one small change</text>
<line x1="247" y1="426" x2="258" y2="426" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 250.8 422.5 L 258 426 L 250.8 429.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="262" y="380" width="164" height="92" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="274" y="406" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Dark</text>
<text x="274" y="428.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">deployed, 0%</text>
<text x="274" y="447" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">exposed</text>
<line x1="429" y1="426" x2="440" y2="426" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 432.8 422.5 L 440 426 L 432.8 429.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="444" y="380" width="104" height="92" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="456" y="406" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Staff</text>

<line x1="551" y1="426" x2="562" y2="426" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 554.8 422.5 L 562 426 L 554.8 429.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="566" y="380" width="104" height="92" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="578" y="406" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">One</text>
<text x="578" y="426.8" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">client</text>

<line x1="673" y1="426" x2="684" y2="426" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 676.8 422.5 L 684 426 L 676.8 429.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="688" y="380" width="104" height="92" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="700" y="406" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">10%</text>

<line x1="795" y1="426" x2="806" y2="426" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 798.8 422.5 L 806 426 L 798.8 429.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="810" y="380" width="158" height="92" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="822" y="406" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Everyone</text>


<line x1="262" y1="492" x2="968" y2="492" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/>
<text x="262" y="516" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">The wait is spent here: on real traffic and real data, widening only as evidence arrives</text>
    <text x="32" y="558" font-size="14" fill="#8a8983" font-weight="400" text-anchor="start">Conceptual schematic. Automated tests and review still come first in both models.</text>
  </g>
</svg>
