<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="dark-title dark-desc">
  <title id="dark-title">Dormant code and a shadow run</title>
  <desc id="dark-desc">Two kinds of dark launch. Dormant: a live request goes to the current code and the user sees the current result; the new code is deployed behind a flag that is off, and nothing calls it. Shadow: a live request goes to the current code and the user sees the current result; a copy of the traffic also goes to the new code, its result is compared with the current code's result, and its output is then discarded without any user seeing it.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="680" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Dormant code and a shadow run</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">Both are dark launches: deployed to production, with no user seeing the new behavior.</text>
    <text x="32" y="126" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">DORMANT: DEPLOYED BEHIND A FLAG THAT IS OFF</text>
<rect x="32" y="140" width="190" height="70" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="44" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Live request</text>

<line x1="226" y1="175" x2="258" y2="175" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 250.8 171.5 L 258 175 L 250.8 178.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="262" y="140" width="200" height="70" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="274" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Current code</text>

<line x1="466" y1="175" x2="498" y2="175" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 490.8 171.5 L 498 175 L 490.8 178.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="502" y="140" width="210" height="70" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="514" y="166" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">User</text>
<text x="514" y="188.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">sees the current result</text>
<rect x="262" y="250" width="200" height="70" rx="8" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/>
<text x="274" y="276" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">New code</text>
<text x="274" y="298.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">merged, built, deployed</text>
<rect x="502" y="273" width="150" height="24" rx="12" fill="#f3f2ee" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3"/><text x="577" y="289.32" font-size="12" fill="#0b0b0b" font-weight="400" text-anchor="middle">flag off</text>
<text x="666" y="290" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">nothing calls it</text>
<text x="32" y="386" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">SHADOW: REAL TRAFFIC THROUGH THE NEW CODE, OUTPUT DISCARDED</text>
<rect x="32" y="400" width="190" height="70" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="44" y="426" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Live request</text>

<line x1="226" y1="435" x2="258" y2="435" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 250.8 431.5 L 258 435 L 250.8 438.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="262" y="400" width="200" height="70" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="274" y="426" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Current code</text>

<line x1="466" y1="435" x2="498" y2="435" stroke="#8a8983" stroke-width="2" stroke-linecap="round"/><path d="M 490.8 431.5 L 498 435 L 490.8 438.5" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="502" y="400" width="210" height="70" rx="8" fill="#fcfcfb" stroke="#d9d8d2" stroke-width="1.5"/>
<text x="514" y="426" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">User</text>
<text x="514" y="448.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">sees the current result</text>
<path d="M 127 474 V 565 H 258" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
<line x1="250" y1="565" x2="258" y2="565" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 250.8 561.5 L 258 565 L 250.8 568.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="136" y="554" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">copy of the traffic</text>
<rect x="262" y="530" width="200" height="70" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="274" y="556" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">New code</text>
<text x="274" y="578.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">runs on the copy</text>
<line x1="466" y1="565" x2="498" y2="565" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 490.8 561.5 L 498 565 L 490.8 568.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="502" y="530" width="210" height="70" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="514" y="556" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Compare</text>
<text x="514" y="578.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">with the current result</text>
<line x1="716" y1="565" x2="748" y2="565" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><path d="M 740.8 561.5 L 748 565 L 740.8 568.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="752" y="530" width="216" height="70" rx="8" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/>
<text x="764" y="556" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Discard</text>
<text x="764" y="578.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">no user sees the output</text>
<line x1="432" y1="474" x2="532" y2="526" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M 527.2 519.6 L 532 526 L 524.0 525.8" fill="none" stroke="#8a8983" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="458" y="496" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">current result</text>
    
  </g>
</svg>
