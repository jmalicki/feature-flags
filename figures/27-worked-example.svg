<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="842" viewBox="0 0 1000 842" role="img" aria-labelledby="worked-lanes-title worked-lanes-desc">
  <title id="worked-lanes-title">Worked example from a source table to two models</title>
  <desc id="worked-lanes-desc">A swimlane of the eleven steps in the worked example, with lanes for the transactions table, the ten derived tables, the feature store, model A and model B. Step 1, make the source change additive, is in the transactions table lane. Steps 2 to 5, find every consumer of the ten tables, build v2 of each affected derived table, backfill the v2 history, and audit each v2 table before publishing it, are in the derived tables lane; publishing all ten at one commit point in step 5 rests on vendor documentation alone. Step 6, define merchant_risk_30d_v2 as a new feature, is in the feature store lane, and its month-end hold is judgment. Step 7, train model B on v2 and retrain model A on v1, spans both model lanes. Step 8, shadow model B, is in the model B lane, and its two-week length is judgment. Step 9, run the experiment, and step 10, ramp model B with model A as the fallback, span both model lanes, and each includes a judgment. Step 11, retire the v1 chain, spans the transactions table, derived tables and feature store lanes.</desc>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="1000" height="842" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
    <text x="32" y="46" font-size="26" fill="#0b0b0b" font-weight="700" text-anchor="start">Worked example: from a source table to two models</text>
    <text x="32" y="76" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">The eleven steps by the part of the chain they change.</text>
    <rect x="490" y="104" width="92" height="602" rx="6" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="536" y="124" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle">transactions</text>
<text x="536" y="138.4" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle">table</text>
<rect x="586" y="104" width="92" height="602" rx="6" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
<text x="632" y="124" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle">Ten derived</text>
<text x="632" y="138.4" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle">tables</text>
<rect x="682" y="104" width="92" height="602" rx="6" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="728" y="124" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle">Feature store</text>
<rect x="778" y="104" width="92" height="602" rx="6" fill="#fcfcfb" stroke="none" stroke-width="1.5"/>
<text x="824" y="124" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle">Model A</text>
<rect x="874" y="104" width="92" height="602" rx="6" fill="#f3f2ee" stroke="none" stroke-width="1.5"/>
<text x="920" y="124" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle">Model B</text>

<text x="32" y="172" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">1.</text>
<text x="58" y="172" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Make the source change additive</text>
<text x="58" y="190" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">merchant_id and merchant_category_v2 beside the old column</text>
<rect x="496" y="160" width="80" height="30" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="536" y="180" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">1</text>
<line x1="32" y1="200" x2="480" y2="200" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="222" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">2.</text>
<text x="58" y="222" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Find every consumer of the ten tables</text>
<text x="58" y="240" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">lineage and usage logs; each owner a reviewer</text>
<rect x="592" y="210" width="80" height="30" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="632" y="230" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">2</text>
<line x1="32" y1="250" x2="480" y2="250" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="272" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">3.</text>
<text x="58" y="272" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Build v2 of each affected derived table</text>
<text x="58" y="290" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">beside v1, versioned names, deprecation date for v1</text>
<rect x="592" y="260" width="80" height="30" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="632" y="280" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">3</text>
<line x1="32" y1="300" x2="480" y2="300" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="322" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">4.</text>
<text x="58" y="322" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Backfill the v2 history</text>
<text x="58" y="340" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">dependency order, monthly batches</text>
<rect x="592" y="310" width="80" height="30" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="632" y="330" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">4</text>
<line x1="32" y1="350" x2="480" y2="350" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="372" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">5.</text>
<text x="58" y="372" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Audit each v2 table before publishing it</text>
<text x="58" y="390" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">one commit point for all ten: vendor documentation</text>
<rect x="592" y="360" width="80" height="30" rx="6" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="632" y="380" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">5</text>
<line x1="32" y1="400" x2="480" y2="400" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="422" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">6.</text>
<text x="58" y="422" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Define merchant_risk_30d_v2 as a new feature</text>
<text x="58" y="440" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">materialized online, unread; month-end hold is judgment</text>
<rect x="688" y="410" width="80" height="30" rx="6" fill="#fdece5" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="728" y="430" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">6</text>
<line x1="32" y1="450" x2="480" y2="450" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="472" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">7.</text>
<text x="58" y="472" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Train model B on v2, retrain model A on v1</text>
<text x="58" y="490" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">same date range; each bound to its own features</text>
<rect x="784" y="460" width="176" height="30" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="872" y="480" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">7</text>
<line x1="32" y1="500" x2="480" y2="500" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="522" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">8.</text>
<text x="58" y="522" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Shadow model B on live traffic</text>
<text x="58" y="540" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">two weeks with a weekend and payroll peak: judgment</text>
<rect x="880" y="510" width="80" height="30" rx="6" fill="#fdece5" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="920" y="530" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">8</text>
<line x1="32" y1="550" x2="480" y2="550" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="572" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">9.</text>
<text x="58" y="572" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Run the experiment</text>
<text x="58" y="590" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">model A in control; treatment cap is judgment</text>
<rect x="784" y="560" width="176" height="30" rx="6" fill="#fdece5" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="872" y="580" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">9</text>
<line x1="32" y1="600" x2="480" y2="600" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="622" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">10.</text>
<text x="58" y="622" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Ramp model B with model A as the fallback</text>
<text x="58" y="640" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">promotion on matured labels is judgment</text>
<rect x="784" y="610" width="176" height="30" rx="6" fill="#fdece5" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="872" y="630" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">10</text>
<line x1="32" y1="650" x2="480" y2="650" stroke="#d9d8d2" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="672" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">11.</text>
<text x="58" y="672" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Retire the v1 chain</text>
<text x="58" y="690" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">old feature, v1 tables, then the old column</text>
<rect x="496" y="660" width="272" height="30" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="632" y="680" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">11</text>
<rect x="32" y="726" width="40" height="20" rx="5" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="84" y="741" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Documented by the organizations the text names</text>
<rect x="32" y="754" width="40" height="20" rx="5" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="84" y="769" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Part rests on vendor documentation alone</text>
<rect x="32" y="782" width="40" height="20" rx="5" fill="#fdece5" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="84" y="797" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Includes a hold or limit that is the author's judgment</text>
    
  </g>
</svg>
